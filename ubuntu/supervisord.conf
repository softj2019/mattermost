[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log ; 로그 파일 경로
pidfile=/var/run/supervisord.pid

[program:gitlab-tail]
command=/usr/bin/gitlab-ctl tail
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/gitlab-tail.err.log
stdout_logfile=/var/log/supervisor/gitlab-tail.out.log
user=root

[unix_http_server]
file=/var/run/supervisor.sock   ; 소켓 파일 경로
chmod=0700                      ; 소켓 권한


